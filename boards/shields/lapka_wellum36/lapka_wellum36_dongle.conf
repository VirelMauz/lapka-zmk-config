# Отключаем сон для донгла (он питается от USB)
CONFIG_ZMK_SLEEP=n

# Включаем USB (обязательно для корректной работы донгла и избежания ошибок cdc_acm_uart)
CONFIG_ZMK_USB=y

# Включаем OLED дисплей (используем встроенный стандартный экран)
CONFIG_ZMK_DISPLAY=y

# Настройки батареи и проксирования заряда с половинок (чтобы донгл видел их заряд)
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
