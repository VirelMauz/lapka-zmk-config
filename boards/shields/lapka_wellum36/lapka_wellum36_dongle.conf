# Turn off sleep for dongle
CONFIG_ZMK_SLEEP=n

# Включаем USB HID (ZMK сам настроит нижележащий стек USB, строка CONFIG_USB=y не нужна и вызывает ошибку)
CONFIG_ZMK_USB=y

# Включаем поддержку OLED дисплея
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Настройки батареи и проксирования заряда с половинок
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
