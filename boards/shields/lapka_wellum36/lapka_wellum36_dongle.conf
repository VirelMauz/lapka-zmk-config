# Отключаем сон для донгла (он питается от USB)
CONFIG_ZMK_SLEEP=n

# Включаем USB для стабильной работы
CONFIG_ZMK_USB=y

# КРИТИЧЕСКИ ВАЖНО: Включаем подсистему дисплея ZMK (без этого будет снег)
CONFIG_ZMK_DISPLAY=y

# Настройки батареи и проксирования заряда с половинок
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
