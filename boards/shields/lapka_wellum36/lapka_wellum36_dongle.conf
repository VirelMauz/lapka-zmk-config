# Turn off sleep for dongle (донгл питается от USB)
CONFIG_ZMK_SLEEP=n

# CRITICAL: Явное включение USB стека для определения cdc_acm_uart и работы USB HID
CONFIG_ZMK_USB=y
CONFIG_USB=y
CONFIG_USB_DEVICE_STACK=y

# Включаем поддержку OLED дисплея и расширенный экран
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Настройки батареи и проксирования заряда с половинок
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
