# Отключаем сон для донгла
CONFIG_ZMK_SLEEP=n

# Включаем USB
CONFIG_ZMK_USB=y

# КРИТИЧЕСКИ ВАЖНО: Включаем поддержку дисплея
CONFIG_ZMK_DISPLAY=y

# Настройки батареи и проксирования
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
