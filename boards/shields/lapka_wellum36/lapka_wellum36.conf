# === Battery optimization for Lapka Wellum36 ===

# Низкая мощность передатчика — главное изменение (было +8)
CONFIG_BT_CTLR_TX_PWR_MINUS_4=y

# Нет LED/OLED
CONFIG_ZMK_EXT_POWER=n

# Sleep для половинок
CONFIG_ZMK_SLEEP=y

# Таймаут сна: 5 минут (было 15)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

CONFIG_PM_DEVICE=y
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

# Proxy/fetching оставляем включёнными
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# DCDC
CONFIG_BOARD_ENABLE_DCDC_HV=n

# Фикс осциллятора
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
