# There are no LED's and OLED's so turn off external power
CONFIG_ZMK_EXT_POWER=n

# Enable sleep for both halves
CONFIG_ZMK_SLEEP=y

# Sleep timeout: 5 min (300 секунд * 1000 мс)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

CONFIG_PM_DEVICE=y
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# fix faulty oscillator
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
