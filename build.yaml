# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
---
include:
  - board: nice_nano_v2
    shield: lapka_wellum36_left
  - board: nice_nano_v2
    shield: lapka_wellum36_right
  - board: nice_nano_v2
    shield: lapka_wellum36_dongle
  - board: nice_nano_v2
    shield: settings_reset
  - board: nice_nano_v2
    shield: lapka_wellum36_dongle_display dongle_display
    snippet: studio-rpc-usb-uart
    artifact-name: lapka-dongle-display
